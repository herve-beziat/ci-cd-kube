name: CI — Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style du code
        run: npm run lint

      - name: Exécuter les tests avec couverture
        run: npm run test:coverage

  build-linux:
    name: Build Electron (Linux)
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Builder l'application Electron
        run: npm run build -- --publish never

      - name: Uploader l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: pocketman-linux
          path: dist/
          retention-days: 30

  build-mac:
    name: Build Electron (macOS)
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Builder l'application Electron
        run: npm run build -- --mac --publish never

      - name: Uploader l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: pocketman-mac
          path: dist/
          retention-days: 30
