name: CI — Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check code style
        run: npm run lintz

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build-and-push:
    name: Build and push Docker image
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          IMAGE=ghcr.io/herve-beziat/pocketman
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$VERSION" >> "$GITHUB_OUTPUT"
          else
            SHA_SHORT="${GITHUB_SHA:0:7}"
            echo "tags=$IMAGE:dev,$IMAGE:$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-tests:
    name: End-to-End Tests (${{ matrix.browser }})
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image under test
        run: |
          docker run -d --name pocketman-e2e -p 3000:3000 \
            ghcr.io/herve-beziat/pocketman:${{ needs.build-and-push.outputs.deploy_tag }}

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not become ready in time"
          docker logs pocketman-e2e
          exit 1

      - name: Run end-to-end tests
        env:
          BASE_URL: http://localhost:3000
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Show container logs on failure
        if: failure()
        run: docker logs pocketman-e2e

      - name: Stop container
        if: always()
        run: docker rm -f pocketman-e2e


  deploy:
    name: Deploy to Kubernetes
    needs: [build-and-push, e2e-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.POCKETMAN_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update deployment image
        run: |
          kubectl set image deployment/pocketman \
            pocketman=ghcr.io/herve-beziat/pocketman:${{ needs.build-and-push.outputs.deploy_tag }} \
            -n pocketman

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/pocketman -n pocketman --timeout=120s



  notify:
    name: Notify Google Chat
    needs: [lint, test, build-and-push, e2e-tests, deploy]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Build message
        id: message
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          FAILED_JOBS=""
          [[ "${{ needs.lint.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS lint"
          [[ "${{ needs.test.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS test"
          [[ "${{ needs.build-and-push.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS build-and-push"
          [[ "${{ needs.e2e-tests.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS e2e-tests"
          [[ "${{ needs.deploy.result }}" == "failure" ]] && FAILED_JOBS="$FAILED_JOBS deploy"

          if [[ -n "$FAILED_JOBS" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "text=Pipeline FAILED (failed jobs:$FAILED_JOBS) - commit $SHA_SHORT by $GITHUB_ACTOR - logs: $RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "text=Pipeline SUCCESS - commit $SHA_SHORT by $GITHUB_ACTOR - $RUN_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification
        uses: ./.github/actions/notify-google-chat
        with:
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          message: ${{ steps.message.outputs.text }}
