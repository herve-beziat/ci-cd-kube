name: CI — Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

  build-and-push:
    name: Build and push Docker image
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          IMAGE=ghcr.io/herve-beziat/pocketman
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$VERSION" >> "$GITHUB_OUTPUT"
          else
            SHA_SHORT="${GITHUB_SHA:0:7}"
            echo "tags=$IMAGE:dev,$IMAGE:$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.POCKETMAN_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update deployment image
        run: |
          kubectl set image deployment/pocketman \
            pocketman=ghcr.io/herve-beziat/pocketman:${{ needs.build-and-push.outputs.deploy_tag }} \
            -n pocketman

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/pocketman -n pocketman --timeout=120s

  notify:
    name: Notify Google Chat
    needs: [lint-and-test, build-and-push, deploy]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Build message
        id: message
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "${{ needs.lint-and-test.result }}" == "failure" || "${{ needs.build-and-push.result }}" == "failure" || "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "text=Pipeline FAILED - commit $SHA_SHORT by $GITHUB_ACTOR - logs: $RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "text=Pipeline SUCCESS - commit $SHA_SHORT by $GITHUB_ACTOR - $RUN_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification
        uses: ./.github/actions/notify-google-chat
        with:
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          message: ${{ steps.message.outputs.text }}
